<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Temporal Conference</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="columns is-gapless">
      <div class="column is-8 theme-dark">
        <section
          class="hero is-fullheight"
          style="
            background-image: url(img/bg.png);
            background-repeat: no-repeat;
            background-size: cover;
          "
        >
          <div class="hero-head has-text-centered mt-6">
            <img src="img/logo.png" alt="Temporal" style="height: 120px" />
          </div>

          <div class="hero-body">
            <div class="container content has-text-centered">
              <h1 class="is-size-1">What if your code never failed?</h1>

              <p class="is-size-3">
                Docs, free training, code samples
                <br />
                and a free trial. All waiting for you.
              </p>
            </div>
          </div>

          <div class="hero-foot has-text-centered mb-6">
            <div class="container content">
              <p class="is-uppercase is-size-2">temporal.io</p>

              <p class="has-text-purple">
                WeAreDevelopers World Congress &bull; Berlin, July 2026 &bull;
                Booth A_66
              </p>
            </div>
          </div>
        </section>
      </div>

      <div class="column theme-light has-text-black">
        <section class="hero is-fullheight has-text-centered">
          <div
            class="hero-body is-flex-direction-column is-justify-content-center"
          >
            <img src="img/qr.png" alt="QR code" />
            <p>Scan for more details</p>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
